alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_ms_p95 > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: "@oncall-sre"
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: "@oncall-sre"
    runbook: docs/alerts.md#alert-2
  - name: daily_cost_budget_exceeded
    severity: warning
    condition: total_cost_usd > 2.5
    duration: 10m
    type: symptom-based
    channel: slack
    owner: "@llmops-lead"
    runbook: docs/alerts.md#alert-3
